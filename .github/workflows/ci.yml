name: CI

# Se ejecuta en cada cambio subido a una rama y en cada Pull Request, para
# detectar errores antes de fusionar. No necesita secretos: el tipado, las
# pruebas y la compilación no requieren conectarse a Supabase de verdad. El
# job rls-tests sí levanta una base de datos, pero una local y desechable
# (con Docker, en el propio runner) — nunca toca el proyecto real.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar tipos de rutas de Next.js
        # Necesario antes del typecheck: Next.js genera tipos como
        # `LayoutProps` en `.next/types`, una carpeta que no se sube al
        # repositorio (se genera). Sin este paso, el typecheck de apps/web
        # falla con "Cannot find name 'LayoutProps'".
        run: cd apps/web && npx next typegen

      - name: Comprobar tipos (TypeScript)
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Tests automáticos
        run: pnpm -r test

      - name: Compilar la web (Next.js)
        run: pnpm --filter @cuotly/web build

      - name: Instalar navegador de Playwright
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Tests end-to-end (Playwright)
        run: cd apps/web && pnpm test:e2e

      - name: Compilar el bundle web de la app móvil (comprobación de que el código de Expo compila)
        run: cd apps/mobile && npx expo export --platform web

  rls-tests:
    # Job aparte: levanta una Supabase real en local (con Docker, ya
    # instalado en los runners de GitHub) aplicando las migraciones desde
    # cero, y ejecuta los scripts de supabase/tests/*.sql contra ella. Cada
    # uno lanza una excepción real (RAISE EXCEPTION) en cuanto una regla de
    # RLS se rompe, así que `psql -v ON_ERROR_STOP=1` devuelve un código de
    # salida distinto de cero y este job falla — ya no depende de que
    # alguien lo pegue a mano en el SQL Editor y compare filas a ojo. No
    # necesita ningún secreto: todo corre contra la base local.
    #
    # También instala Node/pnpm (a diferencia de antes) para el test de
    # concurrencia real de CA-05 (Hito 5): esa prueba necesita dos
    # transacciones de servidor genuinamente simultáneas, algo que un
    # script `psql -f` no puede expresar (cada sentencia de nivel superior
    # es su propia transacción secuencial en una única conexión) — ver la
    # cabecera de apps/web/scripts/hito5-concurrency-test.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase en local (aplica las migraciones)
        run: supabase start

      - name: "Hito 2 — Verificar CA-01, CA-02, CA-16, RN-DAT-03, RN-DAT-06, RN-EST-03"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito2_permisos.sql

      - name: "Hito 4 — Verificar HU-10 a HU-15"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito4_solicitudes.sql

      - name: "Hito 5 — Verificar CA-06, CA-07, CA-08, CA-09, CA-17"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito5_consumos.sql

      - name: "Hito 5 — Verificar CA-05 (concurrencia real: dos aceptaciones simultáneas)"
        run: |
          cd apps/web && DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            node scripts/hito5-concurrency-test.mjs

      - name: "Hito 6 — Verificar HU-16 a HU-23, CA-12, CA-13, CA-14"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito6_trabajos.sql

      - name: "HU-21 — Verificar el reparto de tareas (RN-ASG-01, RN-ASG-17, CA-01, CA-17)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hu21_reparto_tareas.sql

      - name: "Hito 7 — Verificar HU-24 a HU-28, HU-35, RN-FIN-13"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito7_mensajes_archivos_finanzas.sql

      - name: "Hito 8 — Verificar HU-30, HU-31, HU-33, HU-34 y RN-NOT-01 a 05"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito8_inicio_busqueda_notificaciones.sql

      - name: "Hito 8 — Verificar la cola y los barridos (RN-FIN-01, RN-FIN-10/11, RN-EST-09/10, §18)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hito8_cola_y_barridos.sql

      - name: "HU-07 — Verificar planes y servicios (RN-COM-09, RN-COM-11, RN-COM-13, RN-COM-18, CA-01, CA-17)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hu07_planes_y_servicios.sql

      - name: "HU-36 — Verificar los ajustes del espacio y la auditoría (§124, §125, §21.2, RN-CLK-10, CA-16)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/hu36_ajustes_auditoria.sql

      - name: "Hito 7 — Verificar idempotencia real de post_message (dos mensajes simultáneos)"
        run: |
          cd apps/web && DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            node scripts/hito7-concurrency-test.mjs

      - name: Parar Supabase
        if: always()
        run: supabase stop
