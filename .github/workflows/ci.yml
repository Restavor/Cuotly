        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/crear_el_panel_del_restaurante.sql

      - name: "Diseño móvil — Verificar la prioridad de la solicitud: los tres niveles, que el motivo es obligatorio al ENVIAR y que no sustituye al orden 1..N (RN-REQ-05/06)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/prioridad_de_la_solicitud.sql

      - name: "Diseño móvil — Verificar los siete permisos del cliente: el Propietario los tiene todos, un Editor nuevo ninguno, cada casilla abre solo lo suyo, 'Consultar informes' abre los informes y nada más, y la lista del panel no contesta a un extraño (RN-EST-15/16/17, RN-REP-01)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/los_siete_permisos_del_cliente.sql

      - name: "Informes — Verificar los cinco niveles: qué secciones admite cada uno, que el nivel es una BARRERA y no una sugerencia, y que un informe con Finanzas no lo ve quien no tenga 'Pagos y facturas' (RN-REP-15/16)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/los_cinco_niveles_de_informe.sql

      - name: "Accesos — Verificar las invitaciones al panel: un correo con cuenta entra en el momento y uno sin cuenta abre una invitación que el equipo tiene que aprobar, el enlace no se gasta sin aprobar ni dos veces, los siete días cuentan desde la aprobación, y el restaurante no ve quién la revisó (RN-ACC-13, RN-PAN-14/15)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/invitaciones_al_panel_del_restaurante.sql

      - name: "Informes — Verificar \"Lo que ha pasado este mes\" y los tiempos de cada cambio: el relato es el del restaurante y el de su periodo, no lleva ni un uuid ni un nombre del equipo, los cobros solo con Finanzas dentro, un pago revertido no cuenta, el dataset trae el código de la solicitud, la fecha de aceptación y el motivo de cada bloqueo pero nunca su texto ni quién lo puso, y la función no está abierta por RPC (RN-REP-18, RN-REP-21, RN-REP-13, RN-REP-16, RN-FIN-04)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/lo_que_ha_pasado_este_mes.sql

      - name: "Integraciones — Verificar la vigilancia de reseñas: la concede el plan y la barrera está en el servidor, solo vienen de Business Profile, tres estrellas o menos es baja, al equipo se le avisa de todas y al restaurante solo de las bajas, y volver a sincronizar no duplica ni vuelve a avisar (RN-INT-10, RN-INT-11, RN-INT-12)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/vigilancia_de_resenas.sql

      - name: "Plazos — Verificar que el plan puede acortar el plazo de realización: se congela al aceptar y por categoría, bajar de plan no reescribe un trabajo en marcha, y los dos contadores —el de avisos y el del Inicio— miden con el congelado y no con el plan de hoy (RN-SLA-18, RN-COM-15)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/plazo_de_realizacion_del_plan.sql

      - name: "Responsable — Verificar que el responsable de un restaurante es opcional, tiene que ser del equipo con pertenencia activa, NO concede permisos, se cae solo cuando esa persona sale del espacio y el cliente no lo ve nunca (RN-EST-19, P7)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/responsable_del_restaurante.sql

      - name: "Planes — Verificar que el plan decide TRES cosas distintas: ordenar los cambios propios, el turno dentro del mismo plazo y el plan alto, y que ninguna arrastra a otra (RN-COM-03, decisión 55)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/el_plan_manda_tres_cosas.sql

      - name: "Diseño móvil — Verificar la foto de perfil: bucket privado y solo imágenes, cada quien cambia solo la suya y bajo su propia carpeta, y el cliente NO ve la cara de nadie del equipo (RN-GLO-09, CLAUDE.md)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/la_foto_de_perfil.sql

      - name: "Diseño móvil — Verificar la foto del restaurante: solo una imagen compartida y sin archivar de ESE local, la ven los dos lados y todo el equipo aunque no lea sus archivos, y quitarla no borra nada (RN-EST-18, decisión 62)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/la_foto_del_restaurante.sql

      - name: "Diseño móvil — Verificar que traer las subtareas y las evidencias bajo la solicitud NO abre ninguna puerta: el cliente no ve ni una tarea, el trabajador sin ese restaurante tampoco, y desde ahí no se marca nada (RN-REQ-07, P7)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/subtareas_bajo_la_solicitud.sql

      - name: "Avisos — Verificar la frecuencia: un obligatorio sale al momento aunque haya resumen, la campana nunca espera, las ocho son las del espacio, y un día sin nada no genera correo (RN-NOT-06, RN-NOT-03)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/al_momento_o_resumen_diario.sql

      - name: "Panel del restaurante — Verificar el seguimiento de la solicitud: el restaurante recibe las fechas de envío, comienzo, publicación y cancelación sin ninguna identidad, otro restaurante no pregunta por lo ajeno y anon no la ejecuta (R08, R11, P7)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/el_seguimiento_de_la_solicitud.sql

      - name: "Panel del restaurante — Verificar la actividad: fechas de verdad, un borrador no cuenta, el periodo recorta, sin Ver facturación no hay cobros, ninguna identidad, otro restaurante no pregunta y anon no la ejecuta (R41, P7, RN-FIN-07)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/la_actividad_del_restaurante.sql

      - name: "Hito 7 — Verificar idempotencia real de post_message (dos mensajes simultáneos)"
        run: |
          cd apps/web && DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            node scripts/hito7-concurrency-test.mjs

      # El sembrado NO es un test, pero se ejecuta aquí por lo que le pasó:
      # la migración 58 metió un parámetro en medio de
      # `set_establishment_data()` y la llamada de `espacio-demo.sql`, que
      # iba por posición, pasó a mandar el teléfono donde se esperaba el
      # correo. El archivo entero murió en esa línea y nadie se enteró,
      # porque hasta ahora CI no lo ejecutaba nunca. Es además la única
      # pieza que recorre las funciones de verdad de punta a punta —alta,
      # plan, solicitudes, trabajos, cobros— y que se planta con una
      # excepción cuando el resultado no es el que dice esperar.
      #
      # Dos veces, y no una: su cabecera promete que es idempotente, y esa
      # promesa es lo que hace que se pueda volver a lanzar sobre el
      # proyecto real sin pensarlo. Ejecutarlo una sola vez no la comprueba.
      - name: "El espacio de demostración se siembra entero, y dos veces (es idempotente)"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed/espacio-demo.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed/espacio-demo.sql

      - name: Parar Supabase
        if: always()
        run: supabase stop

  e2e-datos:
    # Los recorridos CON DATOS (`flujos-espacio-demo` y
    # `ca19-recorridos-movil`), que entran con usuarios de verdad y leen lo
    # que RLS le deja leer a cada uno.
    #
    # Llevaban desde el 02/09/2026 ejecutándose UNA sola vez, a mano, en
    # Windows. Desde el contenedor de Claude Code no se pueden lanzar —su
    # política de salida bloquea el dominio del proyecto—, así que en la
    # práctica no los ejecutaba nadie. Eso costó un fallo real: el
    # restaurante con Menú Diario tenía un 404 en TODAS sus pantallas
    # durante días, porque dos guardas comparaban `role !== "client"` a
    # mano y el rol `client_daily_menu` caía del lado del equipo. Ninguna
    # prueba unitaria montaba esas dos páginas, y los recorridos, que sí lo
    # habrían visto, no corrían.
    #
    # La clave para poder correrlos aquí es que NO necesitan el proyecto
    # real: necesitan *un* Supabase con las migraciones y el espacio de
    # demostración sembrado, y eso es exactamente lo que `supabase start`
    # levanta en el runner. Por tanto **este job no usa ningún secreto**,
    # igual que `rls-tests`. Las claves del Supabase local las imprime el
    # propio CLI y no son un secreto.
    #
    # Job aparte y no un paso más de `rls-tests`, aunque allí ya esté todo
    # en pie, por una razón práctica: cuando esto se ponga rojo, el nombre
    # del check es lo primero que se lee. "e2e-datos en rojo" dice dónde
    # mirar; "rls-tests en rojo" mandaría a buscar una política de RLS que
    # no tiene nada que ver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase en local (aplica las migraciones)
        run: supabase start

      # `supabase start` aplica las migraciones pero NO este archivo:
      # `config.toml` solo siembra `./seed.sql`, que no existe. El espacio
      # de demostración se siembra aquí, y es el que los recorridos dan por
      # hecho (el espacio `demo`, sus cuatro restaurantes y sus siete
      # identidades con la contraseña que la cabecera del archivo dice).
      - name: Sembrar el espacio de demostración
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed/espacio-demo.sql

      # Las tres públicas hacen falta en tiempo de COMPILACIÓN (`next
      # build` las incrusta), así que se ponen antes de compilar y no
      # justo antes de Playwright. `SUPABASE_SERVICE_ROLE_KEY` es de
      # servidor y la necesita `record_classification()`: sin ella la
      # solicitud se queda en "Recibida" y CA-19 para en el segundo paso
      # —el propio test lo comprueba contra `/api/diagnostico` y lo dice
      # con esas palabras—.
      #
      # `${VAR:?}` a propósito: si el CLI cambiara el nombre de una de
      # estas variables, este paso se planta diciendo cuál falta en vez de
      # escribir una cadena vacía y dejar que el fallo aparezca doce
      # minutos después como "Correo o contraseña incorrectos".
      - name: Leer las claves del Supabase local
        run: |
          echo "Variables que imprime el CLI:"
          supabase status -o env | cut -d= -f1
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:?supabase status no imprimió API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:?supabase status no imprimió ANON_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:?supabase status no imprimió SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Instalar navegador de Playwright
        run: cd apps/web && npx playwright install --with-deps chromium

      # `test:e2e:datos` compila ANTES de llamar a Playwright y a
      # propósito: lo que imprime el proceso del WebServer sale recortado,
      # así que un fallo de compilación aparecía como "[WebServer] Failed
      # to type check." y punto. Compilando fuera, el error se lee entero.
      # Pone además E2E_DATOS=1 (sin ella las dos suites se saltan solas y
      # el job quedaría verde sin haber probado nada) y E2E_DIAGNOSTICO=1,
      # que es lo que enciende `/api/diagnostico`.
      - name: "Recorridos con datos (Playwright contra el Supabase local)"
        run: cd apps/web && pnpm test:e2e:datos

      # Un recorrido que falla sin su traza obliga a adivinar. La
      # configuración guarda traza `on-first-retry` y en CI hay un
      # reintento, así que cuando esto se suba habrá traza del segundo
      # intento.
      - name: Guardar las trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Parar Supabase
        if: always()
        run: supabase stop
