<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario · móvil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/e08822f82e80488a7044f07bb63578aa">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.dcell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;min-height:52px;border-radius:12px;text-decoration:none;color:#26292B;box-sizing:border-box;border:1px solid transparent}
a.dcell:hover{background:#FFFFFF;color:#26292B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F5F1; color: #26292B; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">

<header style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span class="k" style="flex-grow: 1">Casa Pepe</span>
<a class="iconbtn plain" href="Buscar.dc.html" aria-label="Buscar reserva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></a>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button class="iconbtn" type="button" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<h1 class="h1" style="flex-grow: 1; text-align: center; font-size: 20px">Septiembre 2026</h1>
<button class="iconbtn" type="button" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</header>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px; flex-grow: 1; min-height: 0">

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; font-weight: 700; color: #5F6368; text-align: center">
<span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ true }}">
<a class="dcell" href="HoyMovil.dc.html" style="{{c.ring}}">
<span class="tnum" style="font-size: 15px; font-weight: 700">{{c.d}}</span>
<span class="tnum" style="font-size: 11px; font-weight: 600; color: #5F6368">{{c.n}}</span>
<span aria-hidden="true" style="display: flex; gap: 2px; height: 4px; width: 28px; border-radius: 999px; overflow: hidden">
<span style="flex-grow: {{c.ia}}; background: #5B4B9A"></span>
<span style="flex-grow: {{c.plat}}; background: #2F6690"></span>
<span style="flex-grow: {{c.web}}; background: #1D6B73"></span>
<span style="flex-grow: {{c.man}}; background: #8C96A3"></span>
</span>
</a>
</sc-if>
<sc-if value="{{c.isClosed}}" hint-placeholder-val="{{ false }}">
<div class="dcell" aria-label="Cerrado">
<span class="tnum" style="font-size: 15px; font-weight: 500; color: #6B7076">{{c.d}}</span>
<span style="font-size: 10px; font-weight: 600; color: #6B7076">cerr.</span>
</div>
</sc-if>
<sc-if value="{{c.isOut}}" hint-placeholder-val="{{ false }}">
<div class="dcell"><span class="tnum" style="font-size: 15px; color: #A3A7AD">{{c.d}}</span></div>
</sc-if>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 4px; font-size: 12px; font-weight: 600">
<span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #5B4B9A"></span>Agente</span>
<span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2F6690"></span>Plataformas</span>
<span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1D6B73"></span>Web</span>
<span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #8C96A3"></span>Manual</span>
</div>

<section class="card" style="gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px">
<h2 class="h2">Sábado 26</h2>
<span class="chip c-ok chip-sm">Hoy</span>
<div style="flex-grow: 1"></div>
<span class="tnum muted" style="font-size: 14px">10 reservas · 42 pers.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<div style="display: flex; align-items: center; gap: 8px"><span style="flex-grow: 1">Comida</span><span class="tnum"><strong>23</strong> de 40</span></div>
<div class="meter" aria-hidden="true"><span style="width: 57%"></span></div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 4px"><span style="flex-grow: 1">Cena</span><span class="tnum"><strong>19</strong> de 60</span></div>
<div class="meter" aria-hidden="true"><span style="width: 32%"></span></div>
</div>
<a class="btn btn-ghost btn-sm" href="HoyMovil.dc.html">Ver el día</a>
</section>

</div>

<nav class="tabbar" aria-label="Menú principal" style="grid-template-columns: repeat(4, minmax(0, 1fr))">
<a class="tabi" href="HoyMovil.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>Hoy</a>
<a class="tabi" href="CalendarioMovil.dc.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>Calendario</a>
<a class="tabi" href="AgenteMovil.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><path d="M21 16a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2z"></path><path d="M3 16a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"></path></svg>Agente</a>
<a class="tabi" href="Ajustes.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M4.9 4.9l2.1 2.1"></path><path d="M17 17l2.1 2.1"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="M4.9 19.1L7 17"></path><path d="M17 7l2.1-2.1"></path></svg>Ajustes</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cells = [];
    var start = new Date(2026, 7, 31);
    for (var i = 0; i < 35; i++) {
      var dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var d = dt.getDate();
      var inMonth = dt.getMonth() === 8;
      var dow = i % 7;
      var closed = inMonth && dow === 0;
      var weekend = dow >= 4;
      var ia = 0, plat = 0, web = 0, man = 0;
      if (inMonth && !closed) {
        ia = 1 + (d * 7) % 3 + (weekend ? 2 : 0);
        plat = 1 + (d * 3) % 4 + (weekend ? 2 : 0);
        web = (d * 5) % 3 + (weekend ? 1 : 0);
        man = 1 + d % 3;
        if (d > 26) {
          var k = d === 27 ? 0.7 : 0.35;
          ia = Math.round(ia * k); plat = Math.round(plat * k); web = Math.round(web * k); man = Math.round(man * k);
        }
        if (d === 26) { ia = 3; plat = 3; web = 2; man = 2; }
      }
      var total = ia + plat + web + man;
      var isToday = inMonth && d === 26;
      cells.push({
        d: d, isOpen: inMonth && !closed, isClosed: closed, isOut: !inMonth,
        n: total === 0 ? '·' : String(total),
        ring: isToday ? 'background: #FFFFFF; border-color: #3F7A5C; border-width: 2px' : '',
        ia: ia, plat: plat, web: web, man: man
      });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
