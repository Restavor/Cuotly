<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reserva tu mesa · formulario web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;background:#FFFFFF;color:#26292B}
a{color:#2F5E46}a:hover{color:#234735}
.tnum{font-variant-numeric:tabular-nums}
.lbl{font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.inp{height:48px;box-sizing:border-box;border:1px solid #D9D4CA;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:#26292B;background:#FFFFFF}
.inp::placeholder{color:#7A7F86}
.opt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 8px;box-sizing:border-box;border-radius:12px;border:1px solid #D9D4CA;background:#FFFFFF;color:#26292B;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.opt:hover{background:#F7F5F1}
.opt[aria-pressed="true"]{background:#26292B;border-color:#26292B;color:#FFFFFF}
.opt[disabled]{background:#F1EEE8;border-color:#F1EEE8;color:#6B7076;cursor:not-allowed}
.opt small{font-size:12px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:#3F7A5C;color:#FFFFFF}
.btn-primary:hover{background:#346B4F}
.turno{font-size:13px;font-weight:700;color:#5F6368}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px; background: #FFFFFF; color: #26292B; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Reserva tu mesa</h1>
<span style="font-size: 15px; color: #5F6368">Casa Pepe · Sevilla</span>
</div>
<div role="group" aria-label="Idioma" style="display: flex; gap: 4px">
<button class="opt" type="button" aria-pressed="true" style="font-size: 13px">ES</button>
<button class="opt" type="button" aria-pressed="false" style="font-size: 13px">EN</button>
</div>
</div>

<div class="field">
<span class="lbl">¿Cuántos sois?</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{paxList}}" as="p" hint-placeholder-count="7">
<button class="opt tnum" type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="flex-grow: 1">{{p.label}}</button>
</sc-for>
</div>
<sc-if value="{{mas}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 14px; font-weight: 600; flex-grow: 1">Somos</span>
<div style="display: inline-flex; align-items: center; border: 1px solid #D9D4CA; border-radius: 12px; overflow: hidden">
<button type="button" aria-label="Menos" onClick="{{bajar}}" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; font: inherit; font-size: 20px; cursor: pointer">−</button>
<span class="tnum" style="min-width: 40px; text-align: center; font-weight: 700">{{big}}</span>
<button type="button" aria-label="Más" onClick="{{subir}}" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; font: inherit; font-size: 20px; cursor: pointer">+</button>
</div>
</div>
</sc-if>
<sc-if value="{{grande}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #4A3A00; background: #FDF7E3; border: 1px solid #F0DC94; border-radius: 10px; padding: 8px 10px">A partir de 9 personas, el restaurante te llamará para confirmar la reserva.</span>
</sc-if>
</div>

<div class="field">
<span class="lbl">¿Qué día?</span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{dias}}" as="d" hint-placeholder-count="5">
<button class="opt tnum" type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" disabled="{{d.off}}" style="min-height: 56px">{{d.top}}<small>{{d.sub}}</small></button>
</sc-for>
</div>
</div>

<div class="field">
<span class="lbl">¿A qué hora?</span>
<span class="turno">Comida</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{comida}}" as="h" hint-placeholder-count="4">
<button class="opt tnum" type="button" aria-pressed="{{h.on}}" onClick="{{h.pick}}">{{h.label}}</button>
</sc-for>
</div>
<span class="turno" style="margin-top: 4px">Cena</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cena}}" as="h" hint-placeholder-count="6">
<button class="opt tnum" type="button" aria-pressed="{{h.on}}" onClick="{{h.pick}}">{{h.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div class="field"><label class="lbl" for="w-nom">Nombre</label><input class="inp" id="w-nom" type="text" placeholder="Nombre y apellido"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div class="field"><label class="lbl" for="w-tel">Teléfono</label><input class="inp" id="w-tel" type="tel" placeholder="600 000 000"></div>
<div class="field"><label class="lbl" for="w-mail">Email</label><input class="inp" id="w-mail" type="email" placeholder="tu@correo.com"></div>
</div>
<div class="field"><label class="lbl" for="w-nota">Alergias o peticiones <span style="font-weight: 500; color: #5F6368">(opcional)</span></label><input class="inp" id="w-nota" type="text" placeholder="Ej.: una trona, alergia al marisco"></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #3F7A5C">Acepto la política de privacidad</label>
</div>

<button class="btn btn-primary" type="button" style="width: 100%">{{cta}}</button>
<span style="font-size: 13px; color: #5F6368; text-align: center">Te llegará un email de confirmación.</span>

<div style="flex-grow: 1"></div>
<span style="font-size: 12px; color: #6B7076; text-align: center">Reservas con [Nombre de la app] · Restavor</span>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var pax = st.pax || 2;
    var dia = st.dia || 'dom';
    var hora = st.hora || '21:00';
    var paxList = [1, 2, 3, 4, 5, 6, 7].map(function (n) {
      return { label: n === 7 ? '7+' : String(n), on: pax === n, pick: function () { self.setState({ pax: n }); } };
    });
    var defs = [
      { id: 'sab', top: 'Hoy', sub: 'sáb 26' },
      { id: 'dom', top: 'Dom', sub: '27' },
      { id: 'lun', top: 'Lun', sub: 'cerrado', off: true },
      { id: 'mar', top: 'Mar', sub: '29' },
      { id: 'mie', top: 'Mié', sub: '30' }
    ];
    var dias = defs.map(function (d) {
      return { top: d.top, sub: d.sub, off: !!d.off, on: dia === d.id, pick: function () { self.setState({ dia: d.id }); } };
    });
    function slots(list) {
      return list.map(function (h) { return { label: h, on: hora === h, pick: function () { self.setState({ hora: h }); } }; });
    }
    var comida = dia === 'sab' ? ['14:30', '15:00'] : ['13:00', '13:30', '14:00', '14:30', '15:00'];
    var cena = ['20:00', '20:30', '21:00', '21:30', '22:00', '22:30'];
    var big = st.big || 10;
    var mas = pax === 7;
    var grande = mas && big >= 9;
    return {
      paxList: paxList, dias: dias, comida: slots(comida), cena: slots(cena),
      mas: mas, big: big, grande: grande,
      bajar: function () { self.setState({ big: Math.max(7, big - 1) }); },
      subir: function () { self.setState({ big: big + 1 }); },
      cta: grande ? 'Enviar solicitud' : 'Reservar'
    };
  }
}
</script>
</body>
</html>
